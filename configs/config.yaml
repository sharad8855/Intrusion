# ─────────────────────────────────────────────────────────────────────
# AI Intrusion & Virtual Tripwire System — main configuration
# ─────────────────────────────────────────────────────────────────────

system:
  host: "0.0.0.0"
  port: 8000
  database_url: "sqlite:///./intrusion.db"   # or postgresql://user:pass@host/db
  public_url: ""                              # Optional: e.g. "https://xxxx.ngrok-free.app" to send image alerts to WhatsApp
  snapshot_dir: "./snapshots"
  recording_dir: "./recordings"
  model_dir: "./models"

# ── Security ─────────────────────────────────────────────────────────
# Camera passwords are encrypted (AES/Fernet) before being stored in the
# database. Leave fernet_key empty to disable encryption (stored as-is).
# Generate a key:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
security:
  fernet_key: ""

# ── Device / acceleration ────────────────────────────────────────────
# device:  auto | cpu | cuda | cuda:0
#   auto -> use NVIDIA GPU if available, otherwise CPU.
device:
  mode: "auto"
  half_precision: "auto"      # auto | true | false  (FP16 on GPU only)
  cudnn_benchmark: true       # speeds up GPU when input size is fixed
  cpu_threads: 0              # 0 = auto (use physical core count)

# ── Detection model ──────────────────────────────────────────────────
detection:
  weights: "yolo26n.pt"       # n=nano (fastest) ... x=largest. CPU -> n/s. Supports YOLOv26.
  confidence: 0.25
  iou: 0.5
  # Inference image size. Auto-tuned per device if left as "auto".
  imgsz: "auto"               # auto | 320 | 416 | 640 ...
  classes:                    # COCO ids to keep
    person: 0
    bicycle: 1
    car: 2
    motorcycle: 3
    truck: 7

# ── Model optimization (one-time export for faster inference) ────────
optimization:
  auto_export: true           # export an accelerated model on first run
  gpu_format: "engine"        # engine (TensorRT) | onnx | none
  cpu_format: "openvino"      # openvino | onnx | none

# ── Tracking ─────────────────────────────────────────────────────────
tracking:
  tracker: "configs/custom_bytetrack.yaml"   # Custom ByteTrack config with 120-frame persistence buffer

# ── Pipeline / performance ───────────────────────────────────────────
pipeline:
  target_fps: 30              # processing FPS cap per camera
  frame_skip: 0               # 0 = analyze every frame for absolute minimum lag
  # rtsp_transport is handled automatically: TCP is tried first, then UDP.
  # RTSP ports are auto-scanned (554, 8554, 88, 10554) if the configured
  # port does not answer.
  rtsp_timeout: 8             # seconds — socket timeout per connection attempt
  reconnect_delay: 5          # seconds before retrying a dropped stream
  warmup_frames: 30           # decoder warm-up frames discarded on connect
  max_grab_fails: 120         # consecutive read failures before reconnecting

# ── Redis (alert de-duplication) ─────────────────────────────────────
# Stops the same person's intrusion photo being sent again and again.
# If Redis is unreachable the system automatically falls back to an
# in-memory cache, so alerts still work.
redis:
  enabled: true
  host: "150.241.245.84"
  port: 6379
  db: 0
  password: ""
  alert_dedup_seconds: 900    # suppresses the same tracked person from being captured again
                              # within 5 minutes, while new individuals are captured instantly.

# ── Alerts ───────────────────────────────────────────────────────────
alerts:
  cooldown_seconds: 10        # min gap between alerts for the same track
  whatsapp:
    provider: "twilio"        # twilio | meta | webhook | disabled
    # --- Twilio ---
    twilio_sid: ""
    twilio_token: ""
    twilio_from: "whatsapp:+14155238886"
    twilio_to: "whatsapp:+910000000000"
    # --- Meta Cloud API ---
    meta_token: ""
    meta_phone_id: ""
    meta_to: ""
    # --- Generic webhook ---
    webhook_url: ""

# ── Evidence cleanup ─────────────────────────────────────────────────
cleanup:
  retention_hours: 2
  scan_interval_minutes: 10
